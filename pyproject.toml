[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-aic-retrieval"
version = "0.3.0"
description = "BTC/AIC data indexes and hybrid textual Known-Item Search"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.7.4",
  "numpy>=1.24",
  "Pillow>=10",
  "pyarrow>=12",
  "torch>=2.0",
  "transformers>=4.45,<5",
  "Flask>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.0", "python-dotenv>=1.0"]
video = ["opencv-python>=4.8"]

[project.scripts]
data-processing = "data_processing.cli:main"
kis-baseline = "kis.baseline_cli:main"
kis-hybrid = "kis.hybrid_cli:main"
kis-expansion = "kis.expansion_cli:main"
qna = "qna.cli:main"
llm-events = "llm.event_parser_cli:main"
trake-videos = "trake.video_retrieval_cli:main"
trake-coarse = "trake.temporal_dp_cli:main"
trake-fine = "trake.frame_refinement_cli:main"
trake-verify = "trake.verify_cli:main"
submission-rerank = "submission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "data_processing*", "retrieval*", "llm*", "vlm*", "kis*", "qna*", "trake*", "submission*",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
